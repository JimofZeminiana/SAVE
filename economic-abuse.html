<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Meteo di oggi</title>
  <!-- Inside the single page the outer header is the only one: this page drops its own -->
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stile-test.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* The three bands of the total, with the reader's score marked on them */
    .bands { position: relative; padding-top: 30px; }

    .bands-track {
      display: grid;
      grid-template-columns: var(--cols);
      gap: 4px;
    }

    .bands-track > div {
      height: 10px;
      border-radius: 5px;
      background: var(--land);
    }

    .bands-track > div.is-here { background: var(--ink); }

    .bands-labels {
      display: grid;
      grid-template-columns: var(--cols);
      gap: 4px;
      margin-top: 8px;
      font-size: var(--t-small);
      color: var(--muted);
    }

    .bands-labels .is-here { color: var(--ink); }

    .marker {
      position: absolute;
      top: 0;
      left: var(--at);
      transform: translateX(-50%);
      font-size: var(--t-small);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      animation: marker-in .9s var(--ease) both .15s;
    }

    .marker::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 21px;
      width: 1px;
      height: 12px;
      background: var(--ink);
    }

    @keyframes marker-in { from { left: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .marker { animation: none; } }
  </style>
</head>
<body>
  <header class="site-header" aria-label="Azioni principali">
    <div class="wrap">
      <div class="header-inner">
        <div class="header-top">
          <a class="brand" href="index.html">SAVE</a>
          <a class="exit-btn" id="exitBtn" href="https://www.google.com/search?q=meteo">Esci subito dal sito</a>
        </div>
      </div>
    </div>
  </header>

  <div class="progress wrap" id="progress" aria-label="Avanzamento del questionario"></div>

  <main class="wrap">
    <div class="stage" id="stage" aria-live="polite"></div>
  </main>

  <script src="stile-test.js"></script>
  <script>
    const items = [
      'ti chiede di chiedergli dei soldi',
      'pretende di sapere come hai speso il denaro',
      'pretende che tu gli dia ricevute e/o il resto quando spendi soldi',
      'ti nasconde informazioni finanziarie',
      'prende decisioni finanziarie importanti senza parlartene prima',
      'ti minaccia per farti lasciare il lavoro',
      'pretende che lasci il tuo lavoro',
      'ti picchia se dici che devi andare a lavorare',
      'fa cose per impedirti di andare al lavoro',
      'spende i soldi che ti servono per l’affitto o altre bollette',
      'paga le bollette in ritardo o non paga quelle a tuo nome o a nome di entrambi',
      'accumula debiti a tuo nome facendo cose come usare la tua carta di credito o far salire la bolletta del telefono'
    ];

    const options = [
      ['Mai', 1],
      ['Quasi mai', 2],
      ['Qualche volta', 3],
      ['Spesso', 4],
      ['Molto spesso', 5]
    ];

    // Thresholds of evaluate(), drawn on the report
    const BANDS = [
      { label: 'Bassa', from: 12, to: 18 },
      { label: 'Moderata', from: 19, to: 35 },
      { label: 'Alta', from: 36, to: 60 }
    ];

    const SECONDS_PER_ITEM = 9;

    const answers = Array(items.length).fill(null);
    const stage = document.getElementById('stage');
    const progressEl = document.getElementById('progress');
    // 0 = intro, 1..12 = questions, 13 = result
    let cursor = 0;
    const RESULT = items.length + 1;

    function computeScore() {
      let score = 0;
      let answered = 0;
      answers.forEach(value => {
        if (value !== null) {
          answered += 1;
          score += value;
        }
      });
      return { score, answered };
    }

    function evaluate(score, answered) {
      if (answered < items.length) {
        return { label: '-', text: 'Rispondi a tutte le domande per leggere il risultato.' };
      }
      if (score <= 18) {
        return { label: 'Bassa', text: 'Bassa frequenza di comportamenti di controllo economico. Mantieni attenzione e cerca supporto se la situazione evolve.' };
      }
      if (score <= 35) {
        return { label: 'Moderata', text: 'Sono presenti comportamenti di controllo finanziario che meritano attenzione. Valuta di parlarne con una persona di fiducia o un servizio specialistico.' };
      }
      return { label: 'Alta', text: 'Segnali forti di abuso economico e coercizione. Considera di contattare un Centro Antiviolenza o il 1522 per supporto.' };
    }

    function updateProgress() {
      const done = Math.min(Math.max(cursor - 1, 0), items.length);
      TestKit.progress(progressEl, {
        segments: [{ label: 'Domande', total: items.length, done: cursor === RESULT ? items.length : done, current: cursor > 0 && cursor < RESULT }],
        where: cursor === 0 ? 'Introduzione' : cursor === RESULT ? '<b>Il tuo risultato</b>' : `<b>Domanda ${cursor}</b> di ${items.length}`,
        seconds: cursor === RESULT ? null : (items.length - Math.max(cursor - 1, 0)) * SECONDS_PER_ITEM
      });
    }

    function go(delta) {
      cursor = Math.max(0, Math.min(RESULT, cursor + delta));
      render();
    }

    function introHtml() {
      return `
        <h1 class="title">Abuso economico</h1>
        <p class="lead">Dodici domande su come il tuo partner gestisce il denaro, il lavoro e le spese. Per ognuna scegli quanto spesso succede. Non ci sono risposte giuste o sbagliate.</p>
        <div class="box facts">
          <div class="box-row"><span>Fonte</span><b>Scale of Economic Abuse, SEA-12</b></div>
          <div class="box-row"><span>Domande</span><b>12, una alla volta</b></div>
          <div class="box-row"><span>Tempo</span><b>Circa 2 minuti</b></div>
          <div class="box-row"><span>Le risposte</span><b>Restano su questo dispositivo</b></div>
        </div>
        <p class="note">Puoi tornare indietro o fermarti quando vuoi. Il pulsante in alto, o il tasto Esc, chiude subito il sito.</p>
        <div class="step-actions"><span></span><button class="btn primary" type="button" data-next>Inizia il questionario</button></div>`;
    }

    function questionHtml(index) {
      const value = answers[index];
      return `
        <p class="question" id="question">Quanto spesso il tuo partner ${items[index]}?</p>
        <div class="options" role="radiogroup" aria-labelledby="question" data-keys>
          ${options.map(([label, v], i) => `
            <label class="option">
              <input type="radio" name="answer" value="${v}" ${value === v ? 'checked' : ''}>
              <span class="mark" aria-hidden="true"></span>
              <span class="option-text"><strong>${label}</strong></span>
              <span class="key" aria-hidden="true">${i + 1}</span>
            </label>`).join('')}
        </div>
        <p class="saved" aria-live="polite"></p>
        <div class="step-actions">
          <button class="btn quiet" type="button" data-back>Indietro</button>
          <button class="btn primary" type="button" data-next ${value === null ? 'disabled' : ''}>${index === items.length - 1 ? 'Vedi il risultato' : 'Avanti'}</button>
        </div>`;
    }

    function resultHtml() {
      const { score, answered } = computeScore();
      const result = evaluate(score, answered);
      if (result.label === '-') {
        const first = answers.findIndex(v => v === null);
        return `<div class="report">
          <div class="report-head">
            <h2 class="question" id="question">Mancano ${items.length - answered} risposte</h2>
            <p class="lead">${result.text}</p>
          </div>
          <div class="step-actions"><span></span><button class="btn primary" type="button" data-goto="${first + 1}">Torna alla domanda ${first + 1}</button></div>
        </div>`;
      }

      const span = 60 - 12;
      const cols = BANDS.map(b => `${b.to - b.from + 1}fr`).join(' ');
      const counts = options.map(([label, v]) => [label, answers.filter(a => a === v).length]);
      const headline = {
        Bassa: 'Comportamenti di controllo economico poco frequenti',
        Moderata: 'Comportamenti di controllo economico che meritano attenzione',
        Alta: 'Comportamenti di controllo economico frequenti'
      }[result.label];

      return `<div class="report">
        <div class="report-head">
          <h2 class="question" id="question">${headline}</h2>
          <p class="lead">${result.text}</p>
        </div>

        <section class="report-block" aria-labelledby="totalTitle">
          <h2 id="totalTitle">Il totale, ${score} su 60</h2>
          <div class="bands" style="--cols:${cols}">
            <span class="marker" style="--at:${(score - 12) / span * 100}%">${score}</span>
            <div class="bands-track" aria-hidden="true">${BANDS.map(b => `<div class="${b.label === result.label ? 'is-here' : ''}"></div>`).join('')}</div>
            <div class="bands-labels">${BANDS.map(b => `<span class="${b.label === result.label ? 'is-here' : ''}">${b.label}, da ${b.from} a ${b.to}</span>`).join('')}</div>
          </div>
          <p class="note" style="margin-top:14px">Ogni risposta vale da 1 (mai) a 5 (molto spesso): il totale va quindi da 12 a 60.</p>
        </section>

        <section class="report-block" aria-labelledby="freqTitle">
          <h2 id="freqTitle">Le tue risposte, per frequenza</h2>
          <div class="bars">
            ${counts.map(([label, n], i) => `
              <div class="bar-row">
                <div class="bar-label"><span>${label}</span><span>${n === 1 ? '1 risposta' : n + ' risposte'}</span></div>
                <div class="bar-track"><i class="${i >= 3 ? 'maroon' : i === 2 ? 'ochre' : 'grey'}" style="--w:${n / items.length * 100}%"></i></div>
              </div>`).join('')}
          </div>
        </section>

        <section class="report-block" aria-labelledby="nextTitle">
          <h2 id="nextTitle">Cosa puoi fare adesso</h2>
          <p>Un Centro Antiviolenza può aiutarti anche sugli aspetti economici: conti, debiti, lavoro e documenti. Il contatto è gratuito e riservato.</p>
          <div class="btn-row">
            <a class="btn primary" href="tel:1522">Chiama il 1522</a>
            <a class="btn" href="trova-centro.html">Cerca un centro antiviolenza</a>
            <button class="btn" type="button" id="exportBtn">Scarica le risposte in PDF</button>
          </div>
        </section>

        <div class="disclaimer">
          <p>Lo SEA-12 misura quanto spesso si verificano alcuni comportamenti di controllo economico. Le tre fasce sono indicative: non sono una diagnosi e non dicono, da sole, se una relazione è violenta.</p>
        </div>

        <div class="step-actions">
          <button class="btn quiet" type="button" data-back>Rivedi le risposte</button>
          <button class="btn" type="button" id="resetBtn">Azzera le risposte</button>
        </div>
      </div>`;
    }

    function render() {
      updateProgress();
      if (cursor === 0) TestKit.swap(stage, introHtml(), { focus: false });
      else if (cursor === RESULT) TestKit.swap(stage, resultHtml());
      else TestKit.swap(stage, questionHtml(cursor - 1));
    }

    stage.addEventListener('change', event => {
      if (event.target.name !== 'answer') return;
      const index = cursor - 1;
      const wasAnswered = answers[index] !== null;
      answers[index] = Number(event.target.value);
      stage.querySelector('[data-next]').disabled = false;
      TestKit.confirmThen(() => go(1), { auto: !wasAnswered });
    });

    stage.addEventListener('click', event => {
      if (event.target.closest('[data-next]')) go(1);
      if (event.target.closest('[data-back]')) go(-1);
      const jump = event.target.closest('[data-goto]');
      if (jump) { cursor = Number(jump.dataset.goto); render(); }
      if (event.target.closest('#resetBtn')) { answers.fill(null); cursor = 0; render(); }
      if (event.target.closest('#exportBtn')) exportPdf();
    });

    function exportPdf() {
      const { score, answered } = computeScore();
      const outcome = evaluate(score, answered);
      const now = new Date().toLocaleDateString('it-IT') + ' ' + new Date().toLocaleTimeString('it-IT');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const margin = 15;
      const pageW = 210 - margin * 2;
      let y = margin;

      function addLine(text, bold = false, size = 10) {
        doc.setFontSize(size);
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        doc.splitTextToSize(text, pageW).forEach(line => {
          if (y > 280) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += 6;
        });
      }
      function addSeparator() { doc.setDrawColor(100); doc.line(margin, y, 210 - margin, y); y += 5; }

      addLine('QUESTIONARIO ABUSO ECONOMICO - RISPOSTE', true, 14);
      addLine(`Data: ${now}`);
      addSeparator();
      addLine('DOMANDE E RISPOSTE', true, 12);
      items.forEach((item, index) => {
        const found = options.find(([, v]) => v === answers[index]);
        addLine(`${index + 1}. Quanto spesso il tuo partner ${item}?`);
        addLine(`   Risposta: ${found ? found[0] : '-'}`, true);
        y += 2;
      });
      addSeparator();
      addLine('RISULTATI', true, 12);
      addLine(`Valore totale: ${score} / 60`);
      addLine(`Domande risposte: ${answered} / ${items.length}`);
      if (answered === items.length) addLine(`Valutazione: ${outcome.label}`, true);
      addLine(outcome.text);
      doc.save('Abuso_Economico_risposte.pdf');
    }

    render();
  </script>
  <script src="quick-exit.js"></script>
</body>
</html>
