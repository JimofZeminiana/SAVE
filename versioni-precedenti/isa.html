<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteo di oggi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --paper: #f7f4ed;
      --ink: #171717;
      --muted: #68635d;
      --line: #171717;
      --soft: #e7e1d6;
      --white: #fffdfa;
      --red: #b22b24;
      --blue: #12606d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.42;
      background: linear-gradient(90deg, rgba(23, 23, 23, .045) 1px, transparent 1px) 0 0/48px 48px, linear-gradient(0deg, rgba(23, 23, 23, .035) 1px, transparent 1px) 0 0/48px 48px, var(--paper);
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 12px clamp(14px, 5vw, 40px);
      border-bottom: 2px solid var(--line);
      background: rgba(247, 244, 237, .98);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 36px;
      height: 36px;
      flex: none;
      border: 2px solid var(--line);
      background: var(--white);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: .78rem;
    }

    .header-title {
      display: grid;
      min-width: 0;
    }

    .header-title strong {
      font-size: .95rem;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    .tiny,
    .eyebrow {
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .header-btn {
      border: 2px solid var(--line);
      background: var(--white);
      color: var(--ink);
      padding: 9px 12px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: .78rem;
      letter-spacing: .05em;
      cursor: pointer;
      white-space: nowrap;
    }

    .exit-btn {
      border-color: var(--red);
      background: #f20d0d;
      color: #fff;
      font-weight: 800;
      flex: none;
    }

    .progress-wrap {
      position: sticky;
      top: 61px;
      z-index: 19;
      background: var(--paper);
      border-bottom: 2px solid var(--line);
    }

    .progress-track {
      height: 8px;
      background: var(--soft);
      border-bottom: 1px solid rgba(23, 23, 23, .25);
    }

    .progress-fill {
      height: 100%;
      background: var(--blue);
      width: 0%;
      transition: width .25s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 6px clamp(14px, 5vw, 40px);
      font-size: .78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    main {
      display: flex;
      justify-content: center;
      padding: clamp(20px, 4vw, 48px) clamp(14px, 5vw, 40px) 80px;
    }

    .stage {
      width: 100%;
      max-width: 720px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      font-size: clamp(2.6rem, 9vw, 5rem);
      line-height: .88;
      text-transform: uppercase;
      letter-spacing: 0;
      max-width: 12ch;
    }

    h2 {
      font-size: clamp(1.5rem, 4vw, 2.1rem);
      line-height: 1.05;
      text-transform: uppercase;
    }

    .lead {
      font-size: clamp(1.05rem, 1.9vw, 1.3rem);
      line-height: 1.28;
    }

    .panel {
      border: 2px solid var(--line);
      background: var(--white);
      padding: clamp(18px, 3vw, 30px);
    }

    .card {
      border: 2px solid var(--line);
      background: var(--white);
      padding: clamp(20px, 3.6vw, 34px);
    }

    .card .eyebrow {
      margin-bottom: 8px;
    }

    .card h2 {
      margin-bottom: 18px;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .option {
      border: 2px solid var(--line);
      background: var(--paper);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 1.05rem;
    }

    .option:hover {
      background: var(--soft);
    }

    .option input {
      width: 20px;
      height: 20px;
      accent-color: var(--blue);
      flex: none;
    }

    .option.selected {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .option.selected input {
      accent-color: var(--paper);
    }

    .binary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .binary-row .option {
      justify-content: center;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      padding: 20px 12px;
    }

    .step-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .step-actions-right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 2px solid var(--line);
      background: var(--paper);
      padding: 11px 16px;
      text-decoration: none;
      cursor: pointer;
      font-size: .92rem;
    }

    .btn.dark {
      background: var(--ink);
      color: var(--paper);
    }

    .btn.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      font-weight: 700;
    }

    .btn.primary:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .btn.link {
      border: none;
      background: none;
      text-decoration: underline;
      padding: 8px 0;
      color: var(--muted);
    }

    .skip-note {
      margin-top: 10px;
      font-size: .82rem;
      color: var(--muted);
    }

    .safety-note {
      border: 3px solid var(--red);
      background: #fff5f4;
      margin-top: 20px;
    }

    .safety-note h2 {
      color: var(--red);
      font-size: clamp(1.2rem, 2.4vw, 1.5rem);
    }

    .safety-note ul {
      margin: 10px 0 0 20px;
      padding: 0;
    }

    .safety-note li {
      margin-bottom: 6px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .result {
      border-left: 10px solid var(--red);
      background: var(--white);
      padding: 18px;
      font-size: 1.1rem;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .privacy-note {
      margin-top: 24px;
      font-size: .8rem;
      color: var(--muted);
    }

    @media (max-width:620px) {
      .binary-row {
        grid-template-columns: 1fr;
      }

      .grid2 {
        grid-template-columns: 1fr;
      }

      .site-header {
        gap: 8px;
      }

      .header-title strong {
        font-size: .82rem;
      }

      h1 {
        font-size: clamp(2.4rem, 13vw, 3.4rem);
      }
    }
  </style>
</head>

<body>
  <header class="site-header" aria-label="Azioni principali">
    <div class="header-left">
      <div class="mark">ISA</div>
      <div class="header-title">
        <strong>Questionario ISA 2023</strong>
        <span class="tiny">Autovalutazione del rischio</span>
      </div>
    </div>
    <a class="header-btn exit-btn" href="https://www.google.com/search?q=meteo" id="exitBtn">Esci subito dal sito</a>
  </header>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label">
      <span id="progressText">Introduzione</span>
      <span>Se sei in pericolo chiama il 112 &middot; supporto gratuito e anonimo 1522</span>
    </div>
  </div>

  <main>
    <div class="stage" id="stage" aria-live="polite"></div>
  </main>

  <script>
    // ---- Validated ISA 2023 content (unchanged item text and weights) ----
    const part1 = [
      [1, 'A volte il mio (ex) partner mi limita nelle decisioni o nelle cose che voglio fare o circa le persone che voglio vedere.'],
      [1, 'A volte il mio (ex) partner mi svalorizza come persona o come genitore.'],
      [1, 'Capita che il mio (ex) partner mi controlli o mi insegua, anche tramite telefono, app, dispositivi, profili social o interazioni online.'],
      [1, 'Capita che il mio (ex) partner mi minacci di farmi del male o di uccidermi.'],
      [2, 'Capita che il mio (ex) partner cerchi di impedirmi di allontanarmi da lui o da casa.'],
      [2, 'Capita che il mio (ex) partner mi faccia del male fisicamente, ad esempio con schiaffi, spinte, pugni o mani intorno al collo.'],
      [2, 'A volte il mio (ex) partner mi costringe ad avere rapporti sessuali, anche quando non ne ho voglia.'],
      [2, 'A volte provo umiliazione per le richieste o i comportamenti del mio (ex) partner riguardo alla mia sfera intima.'],
      [2, 'A causa del mio (ex) partner, ho lasciato il lavoro.'],
      [2, 'Non posso fare liberamente le spese necessarie per la famiglia o comprare le cose che desidero.'],
      [2, 'Capita che i figli siano presenti quando il mio (ex) partner ha comportamenti violenti nei miei confronti. Se non hai figli, segna No.'],
      [2, 'Capita che il mio (ex) partner sia violento fisicamente sui figli. Se non hai figli, segna No.']
    ];
    const part2 = [
      [2, 'Non ho autonomia per potermi muovere o avere contatti col mondo esterno.'],
      [1, 'Non ho mai parlato a nessuno delle mie preoccupazioni riguardo ai comportamenti violenti del mio (ex) partner.'],
      [1, 'Ho parlato con qualcuno o ho contattato i servizi o le Forze dell’Ordine, ma la mia richiesta non è stata presa sul serio, oppure mi è stato detto di lasciar perdere.'],
      [2, 'Sono a conoscenza che il mio (ex) partner ha il porto d’armi e/o possiede un’arma.'],
      [1, 'Sono a conoscenza che il mio (ex) partner fa uso di alcolici, altre sostanze o è dipendente dal gioco.'],
      [1, 'Sono a conoscenza che il mio (ex) partner è stato violento nei confronti di altre partner o altre persone.'],
      [1, 'Sono a conoscenza che il mio (ex) partner ha violato un ordine del giudice emesso in sede penale o civile.'],
      [1, 'Sono a conoscenza che il mio (ex) partner ha precedenti penali o giudiziari.'],
      [1, 'Mi capita di fare uso di farmaci o altre sostanze dopo quello che mi è successo.'],
      [1, 'Mi capita di avere difficoltà a concentrarmi e/o pensieri fissi, ricordi intrusivi o sogni ricorrenti.'],
      [1, 'Mi sento spesso in allerta, con palpitazioni, sudorazione o respiro affannato.'],
      [1, 'A volte ho difficoltà ad addormentarmi o a mantenere il sonno a causa di quello che mi è successo.']
    ];
    const outcomes = {
      A: 'Non sembrano emergere elementi riconducibili ad una situazione di violenza da parte del tuo (ex) partner. Qualora avvengano cambiamenti, puoi ripetere il questionario.',
      B: 'Emergono alcuni elementi riconducibili ad una situazione di violenza. La violenza nelle relazioni intime tende a ripetersi e ad aggravarsi nel tempo: non sottovalutare la situazione.',
      C: 'Emergono alcuni indicatori di violenza da parte del tuo (ex) partner. Non sottovalutare la situazione e considera un confronto con un Centro Antiviolenza o il 1522.',
      D: 'Emergono molteplici indicatori di violenza da parte del tuo (ex) partner. È importante non sottovalutare la situazione e valutare supporto specializzato.',
      E: 'Emergono molteplici indicatori di violenza e aspetti importanti per sicurezza, pericolosità o conseguenze sulla tua vita. Se sei in pericolo chiama il 112; per supporto gratuito e anonimo contatta il 1522.'
    };
    // outcome() and per-item weights are byte-identical to the original scored instrument.
    function outcome(p1, p2) {
      if (p1 === 0 && p2 === 0) return 'A';
      if (p1 === 0 && p2 >= 1) return 'B';
      if (p1 >= 1 && p1 <= 4) return 'C';
      if (p1 >= 5 && p2 <= 4) return 'D';
      if (p1 >= 5 && p2 >= 5) return 'E';
      return '-';
    }

    // Items whose "Sì" answer is a recognized high-lethality indicator in the public-health
    // literature on intimate-partner homicide risk (weapon access, strangulation/severe physical
    // violence, forced sex, threats to kill) — Campbell et al., "Risk Factors for Femicide in
    // Abusive Relationships", Am J Public Health, 2003. These are existing ISA items; nothing new
    // is asked, this only changes when the safety message is surfaced.
    const FLAGGED = new Set(['p1_3', 'p1_5', 'p1_6', 'p2_3']);
    // Part 1 items about children; auto-answered "No" (0) and skipped from the flow if the user
    // has already told us there are no children involved, exactly as the instrument's own
    // "Se non hai figli, segna No" instruction intends.
    const CHILD_ITEMS = new Set([10, 11]);

    const state = {
      fear: null,
      children: null, // 'si' | 'no' | null
      p1: Array(part1.length).fill(null),
      p2: Array(part2.length).fill(null)
    };

    // Step sequence: fixed order, but child-only items are auto-answered and transparently
    // skipped when state.children === 'no'.
    function questionSteps() {
      const steps = [{ kind: 'fear' }, { kind: 'children' }];
      part1.forEach((item, i) => steps.push({ kind: 'q', part: 'p1', index: i, item }));
      part2.forEach((item, i) => steps.push({ kind: 'q', part: 'p2', index: i, item }));
      return steps;
    }
    const allSteps = [{ kind: 'intro' }, ...questionSteps(), { kind: 'result' }];

    function isSkipped(step) {
      return step.kind === 'q' && step.part === 'p1' && CHILD_ITEMS.has(step.index) && state.children === 'no';
    }

    let cursor = 0; // index into allSteps

    function totalQuestionCount() {
      // fear + part1 (minus skipped) + part2
      const skippedChildItems = state.children === 'no' ? CHILD_ITEMS.size : 0;
      return 1 + (part1.length - skippedChildItems) + part2.length;
    }

    function answeredQuestionCount() {
      let n = state.fear !== null ? 1 : 0;
      state.p1.forEach((v, i) => { if (v !== null && !CHILD_ITEMS.has(i)) n++; else if (v !== null && CHILD_ITEMS.has(i) && state.children !== 'no') n++; });
      state.p2.forEach(v => { if (v !== null) n++; });
      return n;
    }

    function total(arr, weights) {
      let sum = 0;
      arr.forEach((v, i) => { if (v === 'si') sum += weights[i][0]; });
      return sum;
    }

    function currentTotals() {
      const p1v = state.p1.map((v, i) => CHILD_ITEMS.has(i) && state.children === 'no' ? 'no' : v);
      return { p1: total(p1v, part1), p2: total(state.p2, part2) };
    }

    function updateProgress(label) {
      const total = totalQuestionCount();
      const answered = Math.min(answeredQuestionCount(), total);
      document.getElementById('progressFill').style.width = (answered / total * 100) + '%';
      document.getElementById('progressText').textContent = label || `Domanda ${answered} di ${total}`;
    }

    function goTo(delta) {
      let next = cursor + delta;
      // skip transparently over child-only items when not applicable
      while (allSteps[next] && isSkipped(allSteps[next])) {
        if (delta >= 0 && allSteps[next].kind === 'q' && allSteps[next].part === 'p1') {
          state.p1[allSteps[next].index] = 'no';
        }
        next += delta >= 0 ? 1 : -1;
      }
      if (next < 0) next = 0;
      if (next >= allSteps.length) next = allSteps.length - 1;
      cursor = next;
      render();
    }

    function handleAnswer(kind, key, value) {
      if (kind === 'fear') state.fear = value;
      if (kind === 'children') state.children = value;
      if (kind === 'q') {
        const [part, idx] = key.split('_');
        const arr = part === 'p1' ? state.p1 : state.p2;
        arr[Number(idx)] = value;
      }
      render();
    }

    function optionRow(name, options, selected, onPick) {
      const wrap = document.createElement('div');
      wrap.className = options.length > 2 ? 'options' : 'binary-row';
      options.forEach(opt => {
        const label = document.createElement('label');
        label.className = 'option' + (selected === opt.value ? ' selected' : '');
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = name;
        input.value = opt.value;
        if (selected === opt.value) input.checked = true;
        input.addEventListener('change', () => onPick(opt.value));
        label.appendChild(input);
        const span = document.createElement('span');
        span.textContent = opt.label;
        label.appendChild(span);
        wrap.appendChild(label);
      });
      return wrap;
    }

    function card(innerNodes, extraClass) {
      const c = document.createElement('div');
      c.className = 'card' + (extraClass ? ' ' + extraClass : '');
      innerNodes.forEach(n => c.appendChild(n));
      return c;
    }

    function actionsRow({ backDisabled, nextLabel, nextDisabled, onBack, onNext, extra }) {
      const row = document.createElement('div');
      row.className = 'step-actions';
      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'btn';
      back.textContent = '← Indietro';
      back.disabled = !!backDisabled;
      back.addEventListener('click', onBack);
      const right = document.createElement('div');
      right.className = 'step-actions-right';
      if (extra) right.appendChild(extra);
      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'btn primary';
      next.textContent = nextLabel || 'Avanti →';
      next.disabled = !!nextDisabled;
      next.addEventListener('click', onNext);
      right.appendChild(next);
      row.appendChild(back);
      row.appendChild(right);
      return row;
    }

    function render() {
      const step = allSteps[cursor];
      const stage = document.getElementById('stage');
      stage.innerHTML = '';

      if (step.kind === 'intro') {
        updateProgress('Introduzione');
        const eyebrow = document.createElement('div');
        eyebrow.className = 'eyebrow';
        eyebrow.textContent = 'Increasing Self-Awareness';
        const h1 = document.createElement('h1');
        h1.textContent = 'ISA 2023';
        const lead = document.createElement('p');
        lead.className = 'lead';
        lead.textContent = 'Rispondi sulla base della tua esperienza. Non ci sono risposte giuste o sbagliate: il risultato serve a capire meglio cosa sta accadendo e quali passi di supporto considerare. Puoi tornare indietro in qualunque momento e uscire subito dal sito con il pulsante in alto.';
        const note = document.createElement('p');
        note.className = 'privacy-note';
        note.textContent = 'Le risposte restano su questa pagina e non vengono inviate altrove. Se sei in pericolo immediato chiama il 112. Per supporto gratuito e anonimo: 1522.';
        const start = document.createElement('button');
        start.type = 'button';
        start.className = 'btn primary';
        start.textContent = 'Inizia il questionario →';
        start.style.marginTop = '24px';
        start.addEventListener('click', () => goTo(1));
        stage.appendChild(card([eyebrow, h1, lead, note, start], 'hero'));
        return;
      }

      if (step.kind === 'fear') {
        updateProgress();
        const eyebrow = document.createElement('div');
        eyebrow.className = 'eyebrow';
        eyebrow.textContent = 'Prima domanda';
        const h2 = document.createElement('h2');
        h2.textContent = 'Temi di subire ancora violenze da parte del tuo partner o ex partner?';
        const options = optionRow('fear', [
          { value: 'Molto', label: 'Molto' },
          { value: 'Abbastanza', label: 'Abbastanza' },
          { value: 'Poco', label: 'Poco' },
          { value: 'Per niente', label: 'Per niente' }
        ], state.fear, v => handleAnswer('fear', null, v));
        const actions = actionsRow({
          backDisabled: true,
          onBack: () => goTo(-1),
          onNext: () => goTo(1)
        });
        stage.appendChild(card([eyebrow, h2, options, actions]));
        return;
      }

      if (step.kind === 'children') {
        updateProgress();
        const eyebrow = document.createElement('div');
        eyebrow.className = 'eyebrow';
        eyebrow.textContent = 'Prima di continuare';
        const h2 = document.createElement('h2');
        h2.textContent = 'Hai figli con il tuo (ex) partner, o vivono minori con voi?';
        const options = optionRow('children', [
          { value: 'si', label: 'Sì' },
          { value: 'no', label: 'No' }
        ], state.children, v => handleAnswer('children', null, v));
        const actions = actionsRow({
          onBack: () => goTo(-1),
          onNext: () => goTo(1)
        });
        stage.appendChild(card([eyebrow, h2, options, actions]));
        return;
      }

      if (step.kind === 'q') {
        const partLabel = step.part === 'p1' ? 'Parte 1' : 'Parte 2';
        updateProgress();
        const eyebrow = document.createElement('div');
        eyebrow.className = 'eyebrow';
        eyebrow.textContent = partLabel + ' · segna "Sì" se corrisponde alla tua esperienza';
        const h2 = document.createElement('h2');
        h2.textContent = step.item[1];
        const arr = step.part === 'p1' ? state.p1 : state.p2;
        const key = step.part + '_' + step.index;
        const selected = arr[step.index] === 'si' ? 'si' : (arr[step.index] === 'no' ? 'no' : null);
        const options = optionRow(key, [
          { value: 'si', label: 'Sì' },
          { value: 'no', label: 'No' }
        ], selected, v => handleAnswer('q', key, v));
        const actions = actionsRow({
          onBack: () => goTo(-1),
          onNext: () => goTo(1)
        });
        stage.appendChild(card([eyebrow, h2, options, actions]));
        return;
      }

      if (step.kind === 'result') {
        const { p1, p2 } = currentTotals();
        const code = outcome(p1, p2);
        updateProgress('Risultato');
        const h2 = document.createElement('h2');
        h2.textContent = 'Risultato';
        const grid = document.createElement('div');
        grid.className = 'grid2';
        const panel = document.createElement('div');
        panel.className = 'panel';
        panel.innerHTML = `
          <h3>Totali</h3>
          <p>Parte 1: <b>${p1}</b> / 20</p>
          <p>Parte 2: <b>${p2}</b> / 14</p>
          <p>Paura dichiarata: <b>${state.fear || 'non indicata'}</b></p>
          <div class="actions">
            <button class="btn" id="resetBtn" type="button">Azzera e ricomincia</button>
            <button class="btn" id="exportBtn" type="button">Scarica PDF</button>
            <a class="btn dark" href="tel:1522" target="_blank">Chiama 1522</a>
            <a class="btn dark" href="trova-centro.html">Trova un centro antiviolenza</a>
          </div>
        `;
        const resultBox = document.createElement('div');
        resultBox.className = 'result';
        resultBox.innerHTML = code === '-' ? 'Completa le domande per leggere il risultato.' : `<h3>Esito ${code}</h3><p>${outcomes[code]}</p>`;
        grid.appendChild(panel);
        grid.appendChild(resultBox);

        // Surface any high-lethality flagged answers here, together with the verdict,
        // rather than interrupting the questionnaire the moment they're given.
        const flaggedHits = [];
        FLAGGED.forEach(key => {
          const [part, idx] = key.split('_');
          const arr = part === 'p1' ? state.p1 : state.p2;
          const items = part === 'p1' ? part1 : part2;
          if (arr[Number(idx)] === 'si') flaggedHits.push(items[Number(idx)][1]);
        });
        let safetyNote = null;
        if (flaggedHits.length) {
          const sh2 = document.createElement('h2');
          sh2.textContent = 'Segnali da non sottovalutare';
          const sp = document.createElement('p');
          sp.className = 'lead';
          sp.textContent = 'Tra le risposte compaiono uno o più elementi spesso associati a un rischio più grave:';
          const ul = document.createElement('ul');
          flaggedHits.forEach(text => {
            const li = document.createElement('li');
            li.textContent = text;
            ul.appendChild(li);
          });
          const sactions = document.createElement('div');
          sactions.className = 'actions';
          sactions.innerHTML = `
            <a class="btn dark" href="tel:112">Chiama 112</a>
            <a class="btn dark" href="tel:1522">Chiama 1522</a>
            <a class="btn" href="trova-centro.html">Trova un centro antiviolenza</a>
          `;
          safetyNote = card([sh2, sp, ul, sactions], 'safety-note');
        }

        const back = document.createElement('button');
        back.type = 'button';
        back.className = 'btn';
        back.textContent = '← Rivedi le risposte';
        back.style.marginTop = '18px';
        back.addEventListener('click', () => goTo(-1));
        const resultCardChildren = [h2, grid];
        if (safetyNote) resultCardChildren.push(safetyNote);
        resultCardChildren.push(back);
        stage.appendChild(card(resultCardChildren));

        document.getElementById('resetBtn').addEventListener('click', () => {
          state.fear = null;
          state.children = null;
          state.p1 = Array(part1.length).fill(null);
          state.p2 = Array(part2.length).fill(null);
          allSteps.length = 0;
          allSteps.push({ kind: 'intro' }, ...questionSteps(), { kind: 'result' });
          cursor = 0;
          render();
        });
        document.getElementById('exportBtn').addEventListener('click', exportPdf);
        return;
      }
    }

    function exportPdf() {
      const { p1, p2 } = currentTotals();
      const code = outcome(p1, p2);
      const fear = state.fear || 'non indicata';
      const now = new Date().toLocaleDateString('it-IT') + ' ' + new Date().toLocaleTimeString('it-IT');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      const margin = 15;
      const pageW = 210 - margin * 2;
      const lineH = 6;
      let y = margin;

      function addLine(text, bold = false, size = 10) {
        doc.setFontSize(size);
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        const lines = doc.splitTextToSize(text, pageW);
        lines.forEach(line => {
          if (y > 280) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += lineH;
        });
      }

      function addSpacer() { y += 3; }
      function addSeparator() { doc.setDrawColor(100); doc.line(margin, y, 210 - margin, y); y += 5; }

      addLine('QUESTIONARIO ISA 2023 - RISPOSTE', true, 14);
      addSpacer();
      addLine(`Data: ${now}`);
      addSpacer();
      addSeparator();

      addLine('PARTE 1', true, 12);
      addSpacer();
      part1.forEach((item, index) => {
        const v = CHILD_ITEMS.has(index) && state.children === 'no' ? 'no' : state.p1[index];
        const answer = v === 'si' ? 'Sì' : (v === 'no' ? 'No' : '-');
        addLine(`${index + 1}. ${item[1]}`);
        addLine(`   Risposta: ${answer}`, true);
        addSpacer();
      });

      addSeparator();
      addLine('PARTE 2', true, 12);
      addSpacer();
      part2.forEach((item, index) => {
        const v = state.p2[index];
        const answer = v === 'si' ? 'Sì' : (v === 'no' ? 'No' : '-');
        addLine(`${index + 1}. ${item[1]}`);
        addLine(`   Risposta: ${answer}`, true);
        addSpacer();
      });

      addSeparator();
      addLine('RISULTATI', true, 12);
      addSpacer();
      addLine(`Parte 1: ${p1} / 20`);
      addLine(`Parte 2: ${p2} / 14`);
      addLine(`Paura dichiarata: ${fear}`);
      addSpacer();
      addLine(`Esito: ${code}`, true);
      if (code !== '-') addLine(outcomes[code]);

      doc.save('ISA_2023_risposte.pdf');
    }

    render();
  </script>
  <script src="quick-exit.js"></script>
</body>

</html>
