<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Meteo di oggi</title>
  <!-- Inside the single page the outer header is the only one: this page drops its own -->
  <script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stile-test.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="site-header" aria-label="Azioni principali">
    <div class="wrap">
      <div class="header-inner">
        <div class="header-top">
          <a class="brand" href="index-apple.html">SAVE</a>
          <a class="exit-btn" id="exitBtn" href="https://www.google.com/search?q=meteo">Esci subito dal sito</a>
        </div>
      </div>
    </div>
  </header>

  <div class="progress wrap" id="progress" aria-label="Avanzamento del questionario"></div>

  <main class="wrap">
    <div class="stage" id="stage" aria-live="polite"></div>
  </main>

  <script src="stile-test.js"></script>
  <script>
    // ---- Validated ISA 2023 content (unchanged item text and weights) ----
    const part1 = [
      [1, 'A volte il mio (ex) partner mi limita nelle decisioni o nelle cose che voglio fare o circa le persone che voglio vedere.'],
      [1, 'A volte il mio (ex) partner mi svalorizza come persona o come genitore.'],
      [1, 'Capita che il mio (ex) partner mi controlli o mi insegua, anche tramite telefono, app, dispositivi, profili social o interazioni online.'],
      [1, 'Capita che il mio (ex) partner mi minacci di farmi del male o di uccidermi.'],
      [2, 'Capita che il mio (ex) partner cerchi di impedirmi di allontanarmi da lui o da casa.'],
      [2, 'Capita che il mio (ex) partner mi faccia del male fisicamente, ad esempio con schiaffi, spinte, pugni o mani intorno al collo.'],
      [2, 'A volte il mio (ex) partner mi costringe ad avere rapporti sessuali, anche quando non ne ho voglia.'],
      [2, 'A volte provo umiliazione per le richieste o i comportamenti del mio (ex) partner riguardo alla mia sfera intima.'],
      [2, 'A causa del mio (ex) partner, ho lasciato il lavoro.'],
      [2, 'Non posso fare liberamente le spese necessarie per la famiglia o comprare le cose che desidero.'],
      [2, 'Capita che i figli siano presenti quando il mio (ex) partner ha comportamenti violenti nei miei confronti. Se non hai figli, segna No.'],
      [2, 'Capita che il mio (ex) partner sia violento fisicamente sui figli. Se non hai figli, segna No.']
    ];
    const part2 = [
      [2, 'Non ho autonomia per potermi muovere o avere contatti col mondo esterno.'],
      [1, 'Non ho mai parlato a nessuno delle mie preoccupazioni riguardo ai comportamenti violenti del mio (ex) partner.'],
      [1, 'Ho parlato con qualcuno o ho contattato i servizi o le Forze dell’Ordine, ma la mia richiesta non è stata presa sul serio, oppure mi è stato detto di lasciar perdere.'],
      [2, 'Sono a conoscenza che il mio (ex) partner ha il porto d’armi e/o possiede un’arma.'],
      [1, 'Sono a conoscenza che il mio (ex) partner fa uso di alcolici, altre sostanze o è dipendente dal gioco.'],
      [1, 'Sono a conoscenza che il mio (ex) partner è stato violento nei confronti di altre partner o altre persone.'],
      [1, 'Sono a conoscenza che il mio (ex) partner ha violato un ordine del giudice emesso in sede penale o civile.'],
      [1, 'Sono a conoscenza che il mio (ex) partner ha precedenti penali o giudiziari.'],
      [1, 'Mi capita di fare uso di farmaci o altre sostanze dopo quello che mi è successo.'],
      [1, 'Mi capita di avere difficoltà a concentrarmi e/o pensieri fissi, ricordi intrusivi o sogni ricorrenti.'],
      [1, 'Mi sento spesso in allerta, con palpitazioni, sudorazione o respiro affannato.'],
      [1, 'A volte ho difficoltà ad addormentarmi o a mantenere il sonno a causa di quello che mi è successo.']
    ];
    const outcomes = {
      A: 'Non sembrano emergere elementi riconducibili ad una situazione di violenza da parte del tuo (ex) partner. Qualora avvengano cambiamenti, puoi ripetere il questionario.',
      B: 'Emergono alcuni elementi riconducibili ad una situazione di violenza. La violenza nelle relazioni intime tende a ripetersi e ad aggravarsi nel tempo: non sottovalutare la situazione.',
      C: 'Emergono alcuni indicatori di violenza da parte del tuo (ex) partner. Non sottovalutare la situazione e considera un confronto con un Centro Antiviolenza o il 1522.',
      D: 'Emergono molteplici indicatori di violenza da parte del tuo (ex) partner. È importante non sottovalutare la situazione e valutare supporto specializzato.',
      E: 'Emergono molteplici indicatori di violenza e aspetti importanti per sicurezza, pericolosità o conseguenze sulla tua vita. Se sei in pericolo chiama il 112; per supporto gratuito e anonimo contatta il 1522.'
    };
    // outcome() and per-item weights are byte-identical to the original scored instrument.
    function outcome(p1, p2) {
      if (p1 === 0 && p2 === 0) return 'A';
      if (p1 === 0 && p2 >= 1) return 'B';
      if (p1 >= 1 && p1 <= 4) return 'C';
      if (p1 >= 5 && p2 <= 4) return 'D';
      if (p1 >= 5 && p2 >= 5) return 'E';
      return '-';
    }

    // Plain-language names for the five outcomes, used on the scale and as the report headline
    const outcomeNames = {
      A: ['Nessun elemento di violenza', 'Dalle tue risposte non emergono elementi di violenza'],
      B: ['Alcuni elementi', 'Dalle tue risposte emergono alcuni elementi da non sottovalutare'],
      C: ['Alcuni indicatori', 'Dalle tue risposte emergono alcuni indicatori di violenza'],
      D: ['Molteplici indicatori', 'Dalle tue risposte emergono molteplici indicatori di violenza'],
      E: ['Molteplici indicatori e rischi per la sicurezza', 'Dalle tue risposte emergono molteplici indicatori di violenza e aspetti importanti per la tua sicurezza']
    };

    // Items whose "Sì" answer is a recognized high-lethality indicator in the public-health
    // literature on intimate-partner homicide risk (weapon access, strangulation/severe physical
    // violence, forced sex, threats to kill) — Campbell et al., "Risk Factors for Femicide in
    // Abusive Relationships", Am J Public Health, 2003. These are existing ISA items; nothing new
    // is asked, this only changes when the safety message is surfaced.
    const FLAGGED = new Set(['p1_3', 'p1_5', 'p1_6', 'p2_3']);
    // Part 1 items about children; auto-answered "No" and left out of the flow when the user
    // has said no children are involved, exactly as the instrument's own
    // "Se non hai figli, segna No" instruction intends.
    const CHILD_ITEMS = new Set([10, 11]);

    // Seconds a person needs on average for each kind of step, for the time left
    const SECONDS = { fear: 12, children: 8, q: 8 };

    const fearOptions = ['Molto', 'Abbastanza', 'Poco', 'Per niente'];

    const state = {
      fear: null,
      children: null, // 'si' | 'no' | null
      p1: Array(part1.length).fill(null),
      p2: Array(part2.length).fill(null)
    };

    const stage = document.getElementById('stage');
    const progressEl = document.getElementById('progress');
    let cursor = 0;

    // The sequence depends on the children answer, so it is rebuilt every time
    function steps() {
      const list = [{ kind: 'intro' }, { kind: 'fear' }, { kind: 'children' }];
      part1.forEach((item, index) => {
        if (!(CHILD_ITEMS.has(index) && state.children === 'no')) list.push({ kind: 'q', part: 'p1', index });
      });
      part2.forEach((item, index) => list.push({ kind: 'q', part: 'p2', index }));
      list.push({ kind: 'result' });
      return list;
    }

    function answerOf(step) {
      if (step.kind === 'fear') return state.fear;
      if (step.kind === 'children') return state.children;
      if (step.kind === 'q') return state[step.part][step.index];
      return null;
    }

    function total(arr, weights) {
      let sum = 0;
      arr.forEach((v, i) => { if (v === 'si') sum += weights[i][0]; });
      return sum;
    }

    function p1Answers() {
      return state.p1.map((v, i) => CHILD_ITEMS.has(i) && state.children === 'no' ? 'no' : v);
    }

    function currentTotals() {
      return { p1: total(p1Answers(), part1), p2: total(state.p2, part2) };
    }

    function updateProgress() {
      const list = steps();
      const questions = list.filter(s => s.kind !== 'intro' && s.kind !== 'result');
      const segment = test => {
        const members = list.map((s, i) => [s, i]).filter(([s]) => test(s));
        return {
          total: members.length,
          done: members.filter(([, i]) => i < cursor).length,
          current: members.some(([, i]) => i === cursor)
        };
      };
      const segments = [
        { label: 'Per iniziare', ...segment(s => s.kind === 'fear' || s.kind === 'children') },
        { label: 'Parte 1', ...segment(s => s.part === 'p1') },
        { label: 'Parte 2', ...segment(s => s.part === 'p2') }
      ];
      const step = list[cursor];
      const position = questions.indexOf(step) + 1;
      const seconds = list.slice(cursor).reduce((sum, s) => sum + (SECONDS[s.kind] || 0), 0);
      TestKit.progress(progressEl, {
        segments,
        where: step.kind === 'intro' ? 'Introduzione' : step.kind === 'result' ? '<b>Il tuo risultato</b>' : `<b>Domanda ${position}</b> di ${questions.length}`,
        seconds: step.kind === 'result' ? null : seconds
      });
    }

    function go(delta) {
      const list = steps();
      cursor = Math.max(0, Math.min(list.length - 1, cursor + delta));
      render();
    }

    function optionsHtml(name, options, selected, binary) {
      return `<div class="options${binary ? ' binary' : ''}" role="radiogroup" aria-labelledby="question" data-keys>
        ${options.map((opt, i) => `
          <label class="option">
            <input type="radio" name="${name}" value="${opt.value}" ${selected === opt.value ? 'checked' : ''}>
            <span class="mark" aria-hidden="true"></span>
            <span class="option-text"><strong>${opt.label}</strong></span>
            <span class="key" aria-hidden="true">${i + 1}</span>
          </label>`).join('')}
      </div>
      <p class="saved" aria-live="polite"></p>`;
    }

    function actionsHtml(answered) {
      return `<div class="step-actions">
        <button class="btn quiet" type="button" data-back>Indietro</button>
        <button class="btn primary" type="button" data-next>${answered ? 'Avanti' : 'Salta la domanda'}</button>
      </div>`;
    }

    function introHtml() {
      return `
        <span class="kicker">Increasing Self-Awareness, Differenza Donna 2023</span>
        <h1 class="title">Questionario ISA</h1>
        <p class="lead">Rispondi sulla base della tua esperienza. Non ci sono risposte giuste o sbagliate: il risultato serve a capire meglio cosa sta accadendo e quali passi di supporto considerare.</p>
        <div class="box facts">
          <div class="box-row"><span>Domande</span><b>Fino a 26, una alla volta</b></div>
          <div class="box-row"><span>Tempo</span><b>Circa 4 minuti</b></div>
          <div class="box-row"><span>Le risposte</span><b>Restano su questo dispositivo</b></div>
        </div>
        <p class="note">Puoi tornare indietro, saltare una domanda o fermarti quando vuoi. Il pulsante in alto, o il tasto Esc, chiude subito il sito.</p>
        <div class="callout"><span class="dot" aria-hidden="true"></span><div><p>Se sei in pericolo adesso chiama il <a href="tel:112">112</a>. Per un aiuto gratuito e anonimo, il <a href="tel:1522">1522</a> risponde 24 ore su 24.</p></div></div>
        <div class="step-actions"><span></span><button class="btn primary" type="button" data-next>Inizia il questionario</button></div>`;
    }

    function questionHtml(step) {
      if (step.kind === 'fear') {
        return `
          <span class="kicker">Per iniziare</span>
          <p class="question" id="question">Temi di subire ancora violenze da parte del tuo partner o ex partner?</p>
          ${optionsHtml('fear', fearOptions.map(v => ({ value: v, label: v })), state.fear)}
          ${actionsHtml(state.fear !== null)}`;
      }
      if (step.kind === 'children') {
        return `
          <span class="kicker">Per iniziare</span>
          <p class="question" id="question">Hai figli con il tuo (ex) partner, o vivono minori con voi?</p>
          ${optionsHtml('children', [{ value: 'si', label: 'Sì' }, { value: 'no', label: 'No' }], state.children, true)}
          <p class="note">Se rispondi No, le due domande sui figli verranno saltate.</p>
          ${actionsHtml(state.children !== null)}`;
      }
      const list = steps().filter(s => s.part === step.part);
      const n = list.findIndex(s => s.index === step.index) + 1;
      const value = state[step.part][step.index];
      return `
        <span class="kicker">${step.part === 'p1' ? 'Parte 1' : 'Parte 2'}, domanda ${n} di ${list.length}</span>
        <p class="question" id="question">${step.part === 'p1' ? part1[step.index][1] : part2[step.index][1]}</p>
        ${optionsHtml('answer', [{ value: 'si', label: 'Sì' }, { value: 'no', label: 'No' }], value, true)}
        ${actionsHtml(value !== null)}`;
    }

    function resultHtml() {
      const { p1, p2 } = currentTotals();
      const code = outcome(p1, p2);
      const skipped = [...p1Answers(), ...state.p2].filter(v => v === null).length;
      const flagged = [...FLAGGED].filter(key => {
        const [part, idx] = key.split('_');
        return (part === 'p1' ? p1Answers() : state.p2)[Number(idx)] === 'si';
      }).map(key => {
        const [part, idx] = key.split('_');
        return (part === 'p1' ? part1 : part2)[Number(idx)][1];
      });

      return `<div class="report">
        <div class="report-head">
          <span class="kicker">Il tuo risultato</span>
          <h2 class="question" id="question">${outcomeNames[code][1]}</h2>
          <p class="lead">${outcomes[code]}</p>
        </div>

        ${flagged.length ? `<div class="callout"><span class="dot maroon" aria-hidden="true"></span><div>
          <h3>Alcune risposte meritano attenzione subito</h3>
          <p>Questi elementi sono spesso associati a un rischio più grave:</p>
          <ul>${flagged.map(t => `<li>${t}</li>`).join('')}</ul>
          <div class="btn-row"><a class="btn urgent" href="tel:112">Chiama il 112</a><a class="btn" href="tel:1522">Chiama il 1522</a></div>
        </div></div>` : ''}

        <section class="report-block" aria-labelledby="scaleTitle">
          <h2 id="scaleTitle">Dove si colloca il risultato</h2>
          <div class="scale" style="--steps:5" role="list">
            ${Object.keys(outcomeNames).map(k => `<div role="listitem" class="${k === code ? 'is-here' : ''}"${k === code ? ' aria-current="true"' : ''}><b>${k}</b>${outcomeNames[k][0]}</div>`).join('')}
          </div>
        </section>

        <section class="report-block" aria-labelledby="partsTitle">
          <h2 id="partsTitle">Come si arriva a questo risultato</h2>
          <div class="bars">
            <div class="bar-row">
              <div class="bar-label"><span>Parte 1, comportamenti del partner o ex partner</span><span>${p1} su 20</span></div>
              <div class="bar-track"><i class="maroon" style="--w:${p1 / 20 * 100}%"></i></div>
            </div>
            <div class="bar-row">
              <div class="bar-label"><span>Parte 2, contesto, protezione e conseguenze su di te</span><span>${p2} su 14</span></div>
              <div class="bar-track"><i class="ochre" style="--w:${p2 / 14 * 100}%"></i></div>
            </div>
          </div>
          <p class="note" style="margin-top:14px">Ogni Sì vale 1 o 2 punti, secondo il peso previsto dal questionario. L’esito nasce dalla combinazione delle due parti.${state.fear ? ` Alla domanda sulla paura di nuove violenze hai risposto: ${state.fear.toLowerCase()}.` : ''}${skipped ? ` Hai lasciato ${skipped === 1 ? 'una domanda' : skipped + ' domande'} senza risposta: ${skipped === 1 ? 'è contata' : 'sono contate'} come No.` : ''}</p>
        </section>

        <section class="report-block" aria-labelledby="nextTitle">
          <h2 id="nextTitle">Cosa puoi fare adesso</h2>
          <p>Parlarne con il 1522 o con un Centro Antiviolenza è gratuito e riservato, e non ti obbliga a denunciare né a lasciare la relazione.</p>
          <div class="btn-row">
            <a class="btn primary" href="tel:1522">Chiama il 1522</a>
            <a class="btn" href="trova-centro.html">Trova un centro antiviolenza</a>
            <button class="btn" type="button" id="exportBtn">Scarica le risposte in PDF</button>
          </div>
        </section>

        <div class="disclaimer">
          <p>L’ISA è uno strumento di autoconsapevolezza, non una diagnosi né una valutazione professionale del rischio. Il risultato dipende soltanto dalle risposte date oggi: se la situazione cambia, puoi ripetere il questionario.</p>
        </div>

        <div class="step-actions">
          <button class="btn quiet" type="button" data-back>Rivedi le risposte</button>
          <button class="btn" type="button" id="resetBtn">Ricomincia da capo</button>
        </div>
      </div>`;
    }

    function render() {
      const step = steps()[cursor];
      updateProgress();
      if (step.kind === 'intro') TestKit.swap(stage, introHtml(), { focus: false });
      else if (step.kind === 'result') TestKit.swap(stage, resultHtml());
      else TestKit.swap(stage, questionHtml(step));
    }

    stage.addEventListener('change', event => {
      const input = event.target;
      if (input.type !== 'radio') return;
      const step = steps()[cursor];
      const wasAnswered = answerOf(step) !== null;
      if (step.kind === 'fear') state.fear = input.value;
      if (step.kind === 'children') state.children = input.value;
      if (step.kind === 'q') state[step.part][step.index] = input.value;
      const next = stage.querySelector('[data-next]');
      if (next) next.textContent = 'Avanti';
      TestKit.confirmThen(() => go(1), { auto: !wasAnswered });
    });

    stage.addEventListener('click', event => {
      if (event.target.closest('[data-next]')) go(1);
      if (event.target.closest('[data-back]')) go(-1);
      if (event.target.closest('#exportBtn')) exportPdf();
      if (event.target.closest('#resetBtn')) {
        state.fear = null;
        state.children = null;
        state.p1 = Array(part1.length).fill(null);
        state.p2 = Array(part2.length).fill(null);
        cursor = 0;
        render();
      }
    });

    function exportPdf() {
      const { p1, p2 } = currentTotals();
      const code = outcome(p1, p2);
      const fear = state.fear || 'non indicata';
      const now = new Date().toLocaleDateString('it-IT') + ' ' + new Date().toLocaleTimeString('it-IT');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      const margin = 15;
      const pageW = 210 - margin * 2;
      const lineH = 6;
      let y = margin;

      function addLine(text, bold = false, size = 10) {
        doc.setFontSize(size);
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        const lines = doc.splitTextToSize(text, pageW);
        lines.forEach(line => {
          if (y > 280) { doc.addPage(); y = margin; }
          doc.text(line, margin, y);
          y += lineH;
        });
      }

      function addSpacer() { y += 3; }
      function addSeparator() { doc.setDrawColor(100); doc.line(margin, y, 210 - margin, y); y += 5; }

      addLine('QUESTIONARIO ISA 2023 - RISPOSTE', true, 14);
      addSpacer();
      addLine(`Data: ${now}`);
      addSpacer();
      addSeparator();

      addLine('PARTE 1', true, 12);
      addSpacer();
      part1.forEach((item, index) => {
        const v = p1Answers()[index];
        const answer = v === 'si' ? 'Sì' : (v === 'no' ? 'No' : '-');
        addLine(`${index + 1}. ${item[1]}`);
        addLine(`   Risposta: ${answer}`, true);
        addSpacer();
      });

      addSeparator();
      addLine('PARTE 2', true, 12);
      addSpacer();
      part2.forEach((item, index) => {
        const v = state.p2[index];
        const answer = v === 'si' ? 'Sì' : (v === 'no' ? 'No' : '-');
        addLine(`${index + 1}. ${item[1]}`);
        addLine(`   Risposta: ${answer}`, true);
        addSpacer();
      });

      addSeparator();
      addLine('RISULTATI', true, 12);
      addSpacer();
      addLine(`Parte 1: ${p1} / 20`);
      addLine(`Parte 2: ${p2} / 14`);
      addLine(`Paura dichiarata: ${fear}`);
      addSpacer();
      addLine(`Esito: ${code}`, true);
      if (code !== '-') addLine(outcomes[code]);

      doc.save('ISA_2023_risposte.pdf');
    }

    render();
  </script>
  <script src="quick-exit.js"></script>
</body>
</html>
